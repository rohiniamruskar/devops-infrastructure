apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops-challenge
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080


---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-challenge
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
