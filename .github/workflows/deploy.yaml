name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }} \
            ./app

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}

      - name: Deploy namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/postgres.yaml

      - name: Deploy Services
        run: |
          kubectl apply -f k8s/service.yaml

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/backend.yaml

      - name: Deploy backend
        run: |
          sed -i "s|rohiniamruskar/devops-backend:latest|${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}|g" k8s/backend.yaml
          
          kubectl apply -f k8s/backend.yaml

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status \
            deployment/postgres \
            -n devops-challenge \
            --timeout=120s

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/backend \
            -n devops-challenge \
            --timeout=120s

      - name: Verify deployment
        run: |
          echo "===== PODS ====="
          kubectl get pods -n devops-challenge

          echo "===== DEPLOYMENTS ====="
          kubectl get deployments -n devops-challenge

          echo "===== SERVICES ====="
          kubectl get svc -n devops-challenge
